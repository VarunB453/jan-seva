services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5001
    command: npm run dev
    ports:
      - "127.0.0.1:5001:5000"
    read_only: false
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      target: development
    environment:
      HOST: 0.0.0.0
      BROWSER: none
      BACKEND_PROXY_TARGET: http://backend:5000
    command: npm start
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      disable: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
